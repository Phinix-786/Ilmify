name: teacher_student
description: "A Flutter app for connecting teachers and students"

version: 1.0.0+49

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  firebase_database: ^11.2.1
  firebase_storage: ^12.3.7
  cloud_firestore: ^5.6.12
  googleapis: ^11.4.0
  http: ^1.1.2
  workmanager: ^0.9.0+3
  
  # Google Sign In
  google_sign_in: ^6.2.2
  permission_handler: 12.0.1
  
  # Image Picker
  image_picker: ^1.0.7
  
  # OpenStreetMap (replaces Google Maps)
  flutter_osm_plugin: ^1.0.3
  
  # Location
  geolocator: ^13.0.2
  
  # UI
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^18.0.1
  
  # App Icon Launcher
  flutter_launcher_icons: ^0.14.1
  onesignal_flutter: ^5.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icon.png
    - assets/logo.png
    - android/app/src/main/res/drawable/logo.png